<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaDownload</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #0e8ce9;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      font-size: 12px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: #38a9f8;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status.offline {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.3);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      color: var(--muted);
      font-size: 11px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 12px;
      outline: none;
    }
    input:focus {
      border-color: var(--primary);
    }
    button {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    .media-list {
      margin-top: 12px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .media-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .media-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 4px;
      margin-bottom: 4px;
      font-size: 11px;
    }
    .media-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
    }
    .media-btn {
      width: auto;
      padding: 3px 8px;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>NovaDownload</span>
    </div>
    <div id="statusBadge" class="status offline">
      <span class="status-dot"></span>
      <span id="statusText">Checking...</span>
    </div>
  </div>

  <div class="form-group">
    <label for="downloadUrl">Download URL</label>
    <input type="text" id="downloadUrl" placeholder="https://example.com/file.zip">
  </div>

  <button id="sendBtn">Send to NovaDownload</button>

  <div class="media-list" id="mediaSection" style="display: none;">
    <div class="media-title">Detected Media on Page</div>
    <div id="mediaItems"></div>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
